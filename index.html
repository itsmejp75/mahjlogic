    <meta charset="UTF-8" />
    <!-- First paint before bundled CSS (Capacitor WKWebView + splash handoff). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mahjlogic.appTheme')
          var colors = { dark: '#23282e', blue: '#1e2d42', purple: '#2a2438' }
          if (t === 'tan') t = 'purple'
          if (t !== 'blue' && t !== 'purple') t = 'dark'
          document.documentElement.setAttribute('data-app-theme', t)
          document.documentElement.style.backgroundColor = colors[t]
        } catch (e) {
          document.documentElement.setAttribute('data-app-theme', 'dark')
          document.documentElement.style.backgroundColor = '#23282e'
        }
      })()
    </script>
    <style>
      html {
        /* Match --app-bg-base / --app-bg-page-pad-color (solid app chrome). */
        background-color: #23282e;
      }
      html[data-app-theme='blue'] {
        background-color: #1e2d42;
      }
      html[data-app-theme='purple'] {
        background-color: #2a2438;
      }
      /*
       * iOS PWA: `apple-touch-startup-image` only fires when a media query matches the device
       * exactly; portrait launches (or unmatched sizes) fall back to a white screen. This
       * inline cover paints `#121419` + watermark splash (same master as
       * `apple-touch-startup-image`) immediately after HTML loads so there is no white flash
       * or app-icon flash before React mounts. Hidden in the browser tab.
       */
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background-color: #121419;
        pointer-events: none;
        opacity: 1;
        transition: opacity 240ms ease-out;
      }
      #pwa-splash > img {
        width: auto;
        height: auto;
        max-width: min(100vw, 100vh);
        max-height: min(100vw, 100vh);
        object-fit: contain;
      }
      #pwa-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      html[data-native-app] #pwa-splash,
      html[data-home-screen-app] #pwa-splash {
        display: flex;
      }
      @media (display-mode: standalone) {
        #pwa-splash {
          display: flex;
        }
      }
    </style>

    <!--
      Set before any bundled CSS/JS so first layout uses `html[data-native-app]` rules
      (avoids flash: full width → squished). Mirrors @capacitor/core getPlatformId.
    -->
    <script>
      (function () {
        try {
          var w = window;
          if (
            w.androidBridge ||
            (w.webkit &&
              w.webkit.messageHandlers &&
              w.webkit.messageHandlers.bridge)
          ) {
            document.documentElement.setAttribute('data-native-app', '');
          }
        } catch (e) {}
      })();
    </script>
    <title>MahjLogic: American Mah Jongg Intelligence</title>

    />
    <meta name="robots" content="index, follow, max-snippet:160, max-image-preview:large, noarchive" />
    <meta name="googlebot" content="index, follow, max-snippet:160, max-image-preview:large, noarchive" />
    <!--
      Installed PWA windows (Chrome on macOS, etc.) often show "{manifest short_name} - {document.title}".
      Keep browser-tab bookmarks reading "Mahj Logic", but clear the title in standalone so the window
      caption is only the manifest/app name. Skip Capacitor WebViews.
    -->
    <script>
      (function () {
        try {
          if (document.documentElement.hasAttribute('data-native-app')) return;
          var q = window.matchMedia('(display-mode: standalone)');
          function apply() {
            var standalone =
              q.matches ||
              (window.navigator && window.navigator.standalone === true);
            if (standalone) document.title = '';
          }
          apply();
          q.addEventListener('change', apply);
        } catch (e) {}
      })();
    </script>

    <!-- Installed-PWA splash cover (watermark master); hidden by `main.tsx` once React mounts. -->
    <div id="pwa-splash" aria-hidden="true">
      <img src="/Splash%20page%20-%20MahjLogic.png?v=14" alt="" />
    </div>
    <!-- data-nosnippet: do not use app UI (incl. card hands) in search result snippets -->
    <div id="root" data-nosnippet></div>
    <!--
      Removed the previous `document.body.style.height = window.innerHeight + 'px'` boot script.
      On iOS WKWebView with `viewport-fit=cover`, `window.innerHeight` returns the layout viewport
      (excludes safe-area extensions) while CSS `body { height: 100dvh }` measures the visual
      viewport (full WebView). Setting body to the smaller `innerHeight` value clipped #root /
      .app-main below the WebView’s actual bottom edge, leaving an unfilled dark band beneath
      the lower play-split. CSS `body { height: 100dvh !important }` in src/index.css now wins
      uncontested and grows with the WebView (incl. dynamic chrome on iPhone Safari).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
