    <!--
      Set before any bundled CSS/JS so first layout uses `html[data-native-app]` rules
      (avoids flash: full width → squished). Mirrors @capacitor/core getPlatformId.
    -->
    <script>
      (function () {
        try {
          var w = window;
          if (
            w.androidBridge ||
            (w.webkit &&
              w.webkit.messageHandlers &&
              w.webkit.messageHandlers.bridge)
          ) {
            document.documentElement.setAttribute('data-native-app', '');
          }
        } catch (e) {}
      })();
    </script>
    <title>MahjLogic: Pro Intelligence Engine for American Mah Jongg Practice</title>
    <!--
      Installed PWA windows (Chrome on macOS, etc.) often show "{manifest short_name} - {document.title}".
      Keep browser-tab bookmarks reading "Mahj Logic", but clear the title in standalone so the window
      caption is only the manifest/app name. Skip Capacitor WebViews.
    -->
    <script>
      (function () {
        try {
          if (document.documentElement.hasAttribute('data-native-app')) return;
          var q = window.matchMedia('(display-mode: standalone)');
          function apply() {
            var standalone =
              q.matches ||
              (window.navigator && window.navigator.standalone === true);
            if (standalone) document.title = '';
          }
          apply();
          q.addEventListener('change', apply);
        } catch (e) {}
      })();
    </script>

    <!--
      Removed the previous `document.body.style.height = window.innerHeight + 'px'` boot script.
      On iOS WKWebView with `viewport-fit=cover`, `window.innerHeight` returns the layout viewport
      (excludes safe-area extensions) while CSS `body { height: 100dvh }` measures the visual
      viewport (full WebView). Setting body to the smaller `innerHeight` value clipped #root /
      .app-main below the WebView’s actual bottom edge, leaving an unfilled dark band beneath
      the lower play-split. CSS `body { height: 100dvh !important }` in src/index.css now wins
      uncontested and grows with the WebView (incl. dynamic chrome on iPhone Safari).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
