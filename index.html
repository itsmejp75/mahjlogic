    <!-- First paint before bundled CSS (Capacitor WKWebView + splash handoff). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mahjlogic.appTheme')
          var colors = { dark: '#151a20', blue: '#0d1522', purple: '#2a2438' }
          if (t === 'tan') t = 'purple'
          if (t !== 'dark' && t !== 'blue' && t !== 'purple') t = 'blue'
          document.documentElement.setAttribute('data-app-theme', t)
          document.documentElement.style.backgroundColor = colors[t]
        } catch (e) {
          document.documentElement.setAttribute('data-app-theme', 'blue')
          document.documentElement.style.backgroundColor = '#0d1522'
        }
      })()
    </script>
    <style>
      html {
        /* Match --app-bg-base / --app-bg-page-pad-color (solid app chrome). Default Abyss. */
        background-color: #0d1522;
      }
      html[data-app-theme='dark'] {
        background-color: #151a20;
      }
      html[data-app-theme='purple'] {
        background-color: #2a2438;
      }
      /*
       * Installed-PWA / native pre-React cover. Mirrors `AuthThemeLoading` (logo + empty
       * status bar) so the handoff to the React load screen is seamless. Hidden in browser
       * tabs. iOS `apple-touch-startup-image` still covers the gap before this HTML paints.
       */
      #pwa-splash {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: max(0.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        /* Always Abyss — same as `.app-theme-loading` (ignore saved Phantom/Mystic). */
        background-color: #0d1522;
        pointer-events: none;
      }
      #pwa-splash__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.35rem;
        width: min(100%, 28rem);
        padding-inline: 1rem;
      }
      #pwa-splash__logo {
        display: block;
        width: min(100%, 22rem);
        max-height: min(28vh, 9.5rem);
        height: auto;
        margin: 0;
        object-fit: contain;
        object-position: center;
        user-select: none;
        -webkit-user-select: none;
        filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.4));
      }
      #pwa-splash__bar {
        position: relative;
        width: min(100%, 14rem);
        height: 0.35rem;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      #pwa-splash__bar-fill {
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00b4d8 0%, #00b4d8 45%, #ffb800 100%);
        transform: scaleX(0);
        transform-origin: left center;
      }
      html[data-native-app] #pwa-splash,
      html[data-home-screen-app] #pwa-splash {
        display: flex;
      }
      @media (display-mode: standalone) {
        #pwa-splash {
          display: flex;
        }
      }
    </style>

    <!--
      Installed PWA windows (Chrome on macOS, etc.) often show "{manifest short_name} - {document.title}".
      Keep browser-tab bookmarks reading "Mahj Logic", but clear the title in standalone so the window
      caption is only the manifest/app name. Skip Capacitor WebViews.
    -->
    <script>
      (function () {
        try {
          if (document.documentElement.hasAttribute('data-native-app')) return;
          var q = window.matchMedia('(display-mode: standalone)');
          function apply() {
            var standalone =
              q.matches ||
              (window.navigator && window.navigator.standalone === true);
            if (standalone) document.title = '';
          }
          apply();
          q.addEventListener('change', apply);
        } catch (e) {}
      })();
    </script>

    <!--
      Removed the previous `document.body.style.height = window.innerHeight + 'px'` boot script.
      On iOS WKWebView with `viewport-fit=cover`, `window.innerHeight` returns the layout viewport
      (excludes safe-area extensions) while CSS `body { height: 100dvh }` measures the visual
      viewport (full WebView). Setting body to the smaller `innerHeight` value clipped #root /
      .app-main below the WebView’s actual bottom edge, leaving an unfilled dark band beneath
      the lower play-split. CSS `body { height: 100dvh !important }` in src/index.css now wins
      uncontested and grows with the WebView (incl. dynamic chrome on iPhone Safari).
    -->
    <script type="module" src="/src/main.tsx"></script>
