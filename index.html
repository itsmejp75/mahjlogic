<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- First paint before bundled CSS (Capacitor WKWebView + splash handoff). -->
    <style>
      html {
        background-color: #1a1a1a;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Nunito:wght@700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      iOS PWA: without `apple-mobile-web-app-capable`, "Add to Home Screen" creates a Safari-wrapped
      shortcut that opens at a wrong default scale (small content + black gutters). With it, iOS
      launches us in standalone mode at full screen and the viewport meta below applies natively.
      `user-scalable=no` + `maximum-scale=1` lock layout to our CSS instead of a pinch-zoom level.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MahjLogic" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Set before any bundled CSS/JS so first layout uses `html[data-native-app]` rules (avoids
      flash: full width → squished). Mirrors @capacitor/core getPlatformId — no module import.
    -->
    <script>
      (function () {
        try {
          var w = window;
          var nav = w.navigator || {};
          var isCapacitor =
            !!w.androidBridge ||
            !!(w.webkit && w.webkit.messageHandlers && w.webkit.messageHandlers.bridge);
          var isIosStandalone = nav.standalone === true;
          var isDisplayStandalone =
            typeof w.matchMedia === 'function' &&
            (w.matchMedia('(display-mode: standalone)').matches ||
              w.matchMedia('(display-mode: fullscreen)').matches);
          if (isCapacitor || isIosStandalone || isDisplayStandalone) {
            document.documentElement.setAttribute('data-native-app', '');
          }
        } catch (e) {}
      })();
    </script>
    <title>MahjLogic — Practice</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Removed the previous `document.body.style.height = window.innerHeight + 'px'` boot script.
      On iOS WKWebView with `viewport-fit=cover`, `window.innerHeight` returns the layout viewport
      (excludes safe-area extensions) while CSS `body { height: 100dvh }` measures the visual
      viewport (full WebView). Setting body to the smaller `innerHeight` value clipped #root /
      .app-main below the WebView’s actual bottom edge, leaving an unfilled dark band beneath
      the lower play-split. CSS `body { height: 100dvh !important }` in src/index.css now wins
      uncontested and grows with the WebView (incl. dynamic chrome on iPhone Safari).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
